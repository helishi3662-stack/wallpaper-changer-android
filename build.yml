name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          git zip unzip openjdk-17-jdk python3-pip \
          autoconf libtool pkg-config zlib1g-dev \
          libncurses5-dev libncursesw5-dev libtinfo5 \
          cmake libffi-dev libssl-dev
        pip install buildozer cython

    - name: Pre-install Android SDK and accept licenses
      run: |
        mkdir -p ~/.buildozer/android/platform
        cd ~/.buildozer/android/platform
        if [ ! -d "android-sdk" ]; then
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip
          mkdir -p android-sdk/cmdline-tools
          mv cmdline-tools android-sdk/cmdline-tools/latest
          rm commandlinetools-linux-11076708_latest.zip
        fi
        yes | android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true
        android-sdk/cmdline-tools/latest/bin/sdkmanager \
          "platforms;android-33" \
          "build-tools;33.0.0" \
          "ndk;25.2.9519653" \
          "platform-tools" || true

    - name: Build APK
      run: |
        buildozer android debug 2>&1 | tee build.log
      timeout-minutes: 60
      env:
        ANDROIDSDK: ~/.buildozer/android/platform/android-sdk
        ANDROIDNDK: ~/.buildozer/android/platform/android-ndk-r25b

    - name: Check build result
      if: always()
      run: |
        echo "=== 检查 bin 目录 ==="
        ls -la bin/ 2>/dev/null || echo "bin 目录不存在"
        echo "=== 搜索所有 APK ==="
        find . -name "*.apk" 2>/dev/null || echo "未找到 APK"
        echo "=== 日志尾部 200 行 ==="
        tail -n 200 build.log || echo "无日志文件"

    - name: Upload APK and logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: wallpaper-changer-apk
        path: |
          bin/*.apk
          build.log
        if-no-files-found: warn
